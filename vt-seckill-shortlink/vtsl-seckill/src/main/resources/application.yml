# ===================================================================
# vtsl-seckill — 秒杀服务（Spring MVC + VT + Redis Lua + Kafka）
# ===================================================================
server:
  port: 8090

spring:
  application:
    name: vtsl-seckill

  # ====== VT 开启（1.4 §1.2） ======
  threads:
    virtual:
      enabled: true

  # ====== JPA / MySQL（t_seckill_activity / t_seckill_order） ======
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.147.134}:3306/livemall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  # ====== Redis Cluster（Lua 库存扣减） ======
  data:
    redis:
      # 单实例（非 cluster）
      host: ${REDIS_HOST:192.168.147.134}
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 15
          max-idle: 10
          min-idle: 5
        # 单实例，无需 read-from

  # ====== Kafka（异步下单） ======
  kafka:
    # Kafka 单实例（VM 192.168.147.134:9092），应用连 PLAINTEXT listener
    # EXTERNAL advertised 就是 VM IP，应用连上 broker 后能正确回连
    bootstrap-servers: ${KAFKA_ADDR:192.168.147.134:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      acks: all                # 单实例 RF=1，等该副本确认；配合 enable-idempotence 防重复
      # 幂等生产者：防网络重试导致的重复消息（配合消费端唯一索引双保险）
      enable-idempotence: true
    consumer:
      group-id: vtsl-seckill
      auto-offset-reset: earliest
      enable-auto-commit: false  # MANUAL ACK
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual  # INSERT 成功后 ack.acknowledge()
      concurrency: 4    # 4 个消费线程（topic 6 partition ≥ 4，线程全部活跃）

  # ====== Nacos ======
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.147.134:8848}
        namespace:
        group: DEFAULT_GROUP
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.147.134:8858}
#      datasource:
#        ds1:
#          nacos:
#            server-addr: ${NACOS_ADDR:192.168.147.134:8848}
#            dataId: vtsl-seckill-rules.json
#            groupId: DEFAULT_GROUP
#            rule-type: flow

  # ====== 优雅停机 ======
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ====== 商品分享短链域名 ======
product:
  share-url-base: ${SHARE_URL_BASE:https://s.livemall.com}

# ====== Dubbo（消费 WsPushService） ======
dubbo:
  application:
    name: vtsl-seckill
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: nacos://${NACOS_ADDR:192.168.147.134:8848}?registry-type=service&group=dubbo
  consumer:
    check: false  # WsPushService provider 可能未启动时不阻塞
    timeout: 3000

# ====== 秒杀业务配置 ======
seckill:
  # 防重 ordered key TTL（24h）
  ordered-ttl-seconds: 86400
  # 创建活动幂等 key TTL（5min）
  idempotency-ttl-seconds: 300
  # 取消/退款防重锁 TTL（10s）
  cancel-lock-ttl-seconds: 10
  # 超时取消开关（压测时置 false）
  timeout-cancel-enabled: false
  # 超时订单扫描间隔（15s）
  timeout-scan-ms: 15000
  # 订单超时阈值（15min）
  order-timeout-minutes: 15
  # 超时扫描每次批量数（500）
  timeout-scan-batch: 500
  # Redis 去重开关（压测时置 false）
  dedup-enabled: true
  # 消费者最大并发数（匹配 HikariCP pool size）
  consumer-max-concurrency: 30
  # Caffeine 活动缓存配置
  activity-cache:
    ttl-seconds: 5
    max-size: 1000
  # ====== RedisSync 自适应降级（P99 + 非对称滞后 + 动态超时） ======
  sync-degrade:
    window-size: 100            # 滑动窗口样本数（全量统计含超时样本）
    max-p99-ms: 800            # 降级阈值：窗口 P99 超此值 → 降级（原 max-avg-ms 升级为 P99）
    max-timeout-rate: 0.05     # 降级信号之二：窗口超时率超 5% → 降级
    mean-recover-ms: 200       # 恢复需均值足够低（迟钝恢复，防毛刺）
    recover-evals: 50          # 恢复需连续健康判定次数（evaluate-interval-ms * 50 ≈ 5s）
    timeout-k: 2.5             # 动态超时系数：P99 + 2.5σ（右偏下≈98.8% 覆盖）
    min-timeout-ms: 100        # 动态超时下限：健康时极速释放线程
    max-timeout-ms: 2000       # 动态超时上限：抖动兜底（冷启动/异常时也护住 UX）
    cold-start-samples: 30     # 样本不足时返回固定 3s 兜底
    send-timeout-seconds: 3    # 冷启动兜底超时（秒）
    sample-rate: 0.05          # 降级后 5% 请求走同步探针感知恢复
    evaluate-interval-ms: 100  # 状态机判定周期（定时任务，不在热路径加状态锁）
    print-interval-ms: 2000    # 窗口诊断日志间隔
  # ====== RedisAsync 可靠性（pending + 补偿 + 监控） ======
  async:
    # pending 标记 TTL（5min，覆盖补投周期与消费时间）
    pending-ttl-seconds: 300
    # pending 补投任务开关（压测时置 false）
    resend-enabled: true
    # pending 补投扫描间隔（30s）
    resend-interval-ms: 30000
    # 每次补投批量上限
    resend-batch: 200
    # 补偿队列消费间隔（5s，比 pending 扫描更快）
    compensate-interval-ms: 5000
    # 补偿重试上限，超过进死信队列
    compensate-max-retry: 3
    # 监控统计间隔（1min）
    monitor-interval-ms: 60000
    # pending 积压告警阈值
    monitor-warn-pending: 100
    # 死信队列积压告警阈值
    monitor-warn-dead-letter: 10
  # ====== 丢单对账（Redis 已扣无订单兜底） ======
  lost-order-enabled: true
  lost-order-scan-ms: 600000     # 每 10min 扫描 ordered:* 无订单标记

# ====== Kafka topic ======
kafka:
  topic:
    seckill-order: seckill-order
    # topic 自动初始化（KafkaTopicConfig / KafkaAdmin 启动时幂等创建）
    seckill-order-partitions: 6
    replication-factor: 1

# ====== 可观测性 ======
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus



#  # ====== 可观测性 ======
#  management:
#    # 1. 端点本身的开关（注意是单数 endpoint）
#    endpoint:
#      startup:
#        enabled: true
#
#    # 2. Web 暴露统一配置（注意是复数 endpoints）
#    endpoints:
#      web:
#        exposure:
#          # 把原有的和 startup 合并到一个 include 中
#          include: health,metrics,prometheus,startup


  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    com.jolumn.vtslseckill: INFO
    org.hibernate.SQL: INFO
#    org.springframework.kafka: WARN
