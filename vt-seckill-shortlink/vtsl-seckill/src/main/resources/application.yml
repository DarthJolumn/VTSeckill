# ===================================================================
# vtsl-seckill — 秒杀服务（Spring MVC + VT + Redis Lua + Kafka）
# ===================================================================
server:
  port: 8090

spring:
  application:
    name: vtsl-seckill

  # ====== VT 开启（1.4 §1.2） ======
  threads:
    virtual:
      enabled: true

  # ====== JPA / MySQL（t_seckill_activity / t_seckill_order） ======
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.147.132}:3306/livemall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  # ====== Redis Cluster（Lua 库存扣减） ======
  data:
    redis:
      # cluster: (切换回 localhost)
      # nodes:
      #   - 192.168.147.132:6381
      #   - 192.168.147.132:6382
      #   - 192.168.147.132:6383
        # 强制读 Master，禁读写分离，避免主从异步复制读到过期库存
      # read-from: MASTER
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 15
          max-idle: 10
          min-idle: 5
        # ⚠️ 待测 cluster:read-from=MASTER 在主从切换(RESP -ASK)期间的可用性
        # 理论上 Cluster 自动 redirect 到新 Master，需实际 failover 验证

  # ====== Kafka（异步下单） ======
  kafka:
    # Kafka 集群在 VM（192.168.147.132），应用也在 VM 跑 → 用 EXTERNAL listener（VM IP + 19092/19094/19096）
    # EXTERNAL advertised 就是 VM IP，应用连上 broker 后能正确回连
    bootstrap-servers: ${KAFKA_ADDR:192.168.147.132:19092,192.168.147.132:19094,192.168.147.132:19096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      acks: all                # 等所有 ISR 副本确认（RF=3 + min.insync.replicas=2）
      # 幂等生产者：防网络重试导致的重复消息（配合消费端唯一索引双保险）
      enable-idempotence: true
    consumer:
      group-id: vtsl-seckill
      auto-offset-reset: earliest
      enable-auto-commit: false  # MANUAL ACK
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual  # INSERT 成功后 ack.acknowledge()
      concurrency: 4    # 4 个消费线程（topic 6 partition ≥ 4，线程全部活跃）

  # ====== Nacos ======
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.147.132:8848}
        namespace:
        group: DEFAULT_GROUP
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.147.132:8858}
#      datasource:
#        ds1:
#          nacos:
#            server-addr: ${NACOS_ADDR:192.168.147.132:8848}
#            dataId: vtsl-seckill-rules.json
#            groupId: DEFAULT_GROUP
#            rule-type: flow

  # ====== 优雅停机 ======
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ====== 商品分享短链域名 ======
product:
  share-url-base: ${SHARE_URL_BASE:https://s.livemall.com}

# ====== Dubbo（消费 WsPushService） ======
dubbo:
  application:
    name: vtsl-seckill
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: nacos://${NACOS_ADDR:192.168.147.132:8848}?registry-type=service&group=dubbo
  consumer:
    check: false  # WsPushService provider 可能未启动时不阻塞
    timeout: 3000

# ====== 秒杀业务配置 ======
seckill:
  # 防重 ordered key TTL（24h）
  ordered-ttl-seconds: 86400
  # 创建活动幂等 key TTL（5min）
  idempotency-ttl-seconds: 300
  # 取消/退款防重锁 TTL（10s）
  cancel-lock-ttl-seconds: 10
  # 超时取消开关（压测时置 false）
  timeout-cancel-enabled: false
  # 超时订单扫描间隔（15s）
  timeout-scan-ms: 15000
  # 订单超时阈值（15min）
  order-timeout-minutes: 15
  # 超时扫描每次批量数（500）
  timeout-scan-batch: 500
  # Redis 去重开关（压测时置 false）
  dedup-enabled: true
  # 消费者最大并发数（匹配 HikariCP pool size）
  consumer-max-concurrency: 30
  # Caffeine 活动缓存配置
  activity-cache:
    ttl-seconds: 5
    max-size: 1000
  # ====== RedisSync 自动降级（同步等待 → 异步受理） ======
  sync-degrade:
    window-size: 100          # 滑动窗口样本数
    max-avg-ms: 500           # 窗口平均耗时阈值(ms)，超过降级
    max-timeout-rate: 0.05    # 窗口超时率阈值(5%)
    sample-rate: 0.05         # 降级后 5% 请求走同步采样（快速恢复）
    recover-threshold: 5      # 连续采样成功次数，达到恢复
    min-recover-delay-ms: 10000  # 降级后最短恢复延迟（防抖）
    degrade-ttl-ms: 60000     # 降级有效期：无流量时 TTL 到期自动尝试恢复（兜底）
    ttl-check-ms: 5000        # TTL 检查间隔
  # ====== RedisAsync 可靠性（pending + 补偿 + 监控） ======
  async:
    # pending 标记 TTL（5min，覆盖补投周期与消费时间）
    pending-ttl-seconds: 300
    # pending 补投任务开关（压测时置 false）
    resend-enabled: true
    # pending 补投扫描间隔（30s）
    resend-interval-ms: 30000
    # 每次补投批量上限
    resend-batch: 200
    # 补偿队列消费间隔（5s，比 pending 扫描更快）
    compensate-interval-ms: 5000
    # 补偿重试上限，超过进死信队列
    compensate-max-retry: 3
    # 监控统计间隔（1min）
    monitor-interval-ms: 60000
    # pending 积压告警阈值
    monitor-warn-pending: 100
    # 死信队列积压告警阈值
    monitor-warn-dead-letter: 10
  # ====== 丢单对账（Redis 已扣无订单兜底） ======
  lost-order-enabled: true
  lost-order-scan-ms: 600000     # 每 10min 扫描 ordered:* 无订单标记

# ====== Kafka topic ======
kafka:
  topic:
    seckill-order: seckill-order
    # topic 自动初始化（KafkaTopicConfig / KafkaAdmin 启动时幂等创建）
    seckill-order-partitions: 6
    replication-factor: 3

# ====== 可观测性 ======
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus



#  # ====== 可观测性 ======
#  management:
#    # 1. 端点本身的开关（注意是单数 endpoint）
#    endpoint:
#      startup:
#        enabled: true
#
#    # 2. Web 暴露统一配置（注意是复数 endpoints）
#    endpoints:
#      web:
#        exposure:
#          # 把原有的和 startup 合并到一个 include 中
#          include: health,metrics,prometheus,startup


  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    com.jolumn.vtslseckill: INFO
    org.hibernate.SQL: INFO
#    org.springframework.kafka: WARN
