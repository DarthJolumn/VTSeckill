server:
  port: 8085

spring:
  application:
    name: vtsl-shortlink-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.28}:3306/vtsl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  # 启动时自动执行 schema.sql（CREATE TABLE IF NOT EXISTS 幂等）建 t_url/t_analytics
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.28}
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:192.168.1.28:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.1.28:8848}
        namespace:
        group: DEFAULT_GROUP
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.1.28:8858}

dubbo:
  application:
    name: vtsl-shortlink-api
  protocol:
    name: dubbo
    port: 20885
  registry:
    address: nacos://${NACOS_ADDR:192.168.1.28:8848}?registry-type=service&group=dubbo
  consumer:
    check: false
    timeout: 3000

shortly:
  kgs:
    grpc-address: ${KGS_GRPC_ADDRESS:localhost:50051}
  geoip:
    base-url: https://ipapi.co
    timeout-seconds: 2
    cache-ttl-hours: 24
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    com.jolumn.vtslshortlinkapi: INFO
    org.hibernate.SQL: INFO
