server:
  port: 8082

spring:
  application:
    name: vtsl-shortlink-keygenerator
  threads:
    virtual:
      enabled: true
  # Boot 4 新前缀 spring.mongodb（spring.data.mongodb 连接属性已 deprecated，实测不生效会落默认 test 库）
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:27017/shortly
    database: shortly
  data:
    mongodb:
      # 行为属性仍在此前缀（DataMongoProperties）；自动为 @Document + @Indexed(unique=true) 建唯一索引
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:192.168.1.28}
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.1.28:8848}
        namespace:
        group: DEFAULT_GROUP

shortly:
  kgs:
    grpc-port: ${KGS_GRPC_PORT:50051}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.jolumn.vtslkgs: INFO
